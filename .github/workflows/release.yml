# Release zu einem Tag wie "1.1.0": erst alle Tests, dann ZIP und Prüfsumme
# bytegleich bauen, attestieren und erst danach veröffentlichen.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions: {}

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  build:
    name: Release-ZIP bauen
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      zip_sha256: ${{ steps.package.outputs.zip_sha256 }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release-ZIP bauen
        run: ./release.sh "$GITHUB_REF_NAME"

      - name: Prüfsumme schreiben
        working-directory: dist
        run: sha256sum "edit_subject-$GITHUB_REF_NAME.zip" > "edit_subject-$GITHUB_REF_NAME.zip.sha256"

      - name: Prüfsumme für die Folgejobs ausgeben
        id: package
        working-directory: dist
        run: echo "zip_sha256=$(sha256sum "edit_subject-$GITHUB_REF_NAME.zip" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

  attest:
    name: Herkunft von ZIP und Prüfsumme attestieren
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ZIP erneut erzeugen
        run: ./release.sh "$GITHUB_REF_NAME"

      - name: Prüfsumme erneut erzeugen
        working-directory: dist
        run: sha256sum "edit_subject-$GITHUB_REF_NAME.zip" > "edit_subject-$GITHUB_REF_NAME.zip.sha256"

      - name: Bytegleichheit mit dem Build prüfen
        working-directory: dist
        run: echo "${{ needs.build.outputs.zip_sha256 }}  edit_subject-$GITHUB_REF_NAME.zip" | sha256sum -c -

      - name: SLSA-Provenance erzeugen
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/edit_subject-*.zip*

  release:
    name: GitHub-Release veröffentlichen
    needs: [attest, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Attestiertes ZIP erneut erzeugen
        run: ./release.sh "$GITHUB_REF_NAME"

      - name: Prüfsumme erneut erzeugen
        working-directory: dist
        run: sha256sum "edit_subject-$GITHUB_REF_NAME.zip" > "edit_subject-$GITHUB_REF_NAME.zip.sha256"

      - name: Bytegleichheit mit dem attestierten Build prüfen
        working-directory: dist
        run: echo "${{ needs.build.outputs.zip_sha256 }}  edit_subject-$GITHUB_REF_NAME.zip" | sha256sum -c -

      - name: Text aus CHANGELOG.md lesen
        run: |
          awk -v version="$GITHUB_REF_NAME" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          if ! grep -q '[^[:space:]]' dist/notes.md; then
            echo "CHANGELOG.md hat keinen Abschnitt für $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/edit_subject-$GITHUB_REF_NAME.zip"
          "dist/edit_subject-$GITHUB_REF_NAME.zip.sha256"
          --repo "$GITHUB_REPOSITORY"
          --title "edit_subject $GITHUB_REF_NAME"
          --notes-file dist/notes.md
          --verify-tag
