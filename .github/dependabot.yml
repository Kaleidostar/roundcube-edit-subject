# Hält die per Commit-SHA angepinnten GitHub Actions aktuell.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /tests/docker/dovecot
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /tests/docker/roundcube
    schedule:
      interval: monthly
    # Die Stufen rc176 und rc1621 testen bewusst die Reihen 1.7 und 1.6.
    # Vorgeschlagen werden nur Patch-Updates; den Wechsel einer Reihe
    # macht ein Mensch, zusammen mit RC_TAG in Makefile, run-tests.sh und
    # .github/workflows/tests.yml.
    ignore:
      - dependency-name: roundcube/roundcubemail
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: docker
    directory: /tests/docker/phpunit
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /tests/docker/runner
    schedule:
      interval: monthly
  - package-ecosystem: composer
    directory: /tests/docker/phpunit
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /tests/docker/runner
    schedule:
      interval: monthly
