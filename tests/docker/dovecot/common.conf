# Shared settings for all Dovecot test instances (Dovecot 2.4 syntax).
# Loaded in addition to the image defaults from /etc/dovecot/conf.d.

# Plain-text login is fine on the internal Docker network of the tests.
auth_allow_cleartext = yes

# Full text search is not part of the system under test and only slows
# down saving the 25 MB message.
mail_plugins {
  fts = no
  fts_flatcurve = no
}
