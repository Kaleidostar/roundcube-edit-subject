# Third test server: every account has a quota of 256 KiB and no grace,
# so the tests can fill a mailbox up to a few bytes below the limit and
# make the APPEND of the edited copy fail with NO [OVERQUOTA].
mail_plugins {
  quota = yes
}

protocol imap {
  mail_plugins {
    imap_quota = yes
  }
}

quota_storage_size = 256k
quota_storage_grace = 0

quota "User quota" {
}
