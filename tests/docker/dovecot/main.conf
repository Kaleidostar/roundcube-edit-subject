# Main test server: standard IMAP with UIDPLUS and ACL.
#
# Three folders get restricted owner rights. The tests create them with
# CREATE when needed; the rights below apply as soon as they exist.
# Measured on Dovecot 2.4.5 (22.11.2026): without "t" a STORE \Deleted
# answers OK but sets nothing, without "e" UID EXPUNGE answers OK but
# removes nothing, without "w" APPEND silently drops all flags except
# \Seen and \Deleted.

mail_plugins {
  acl = yes
}

protocol imap {
  mail_plugins {
    imap_acl = yes
  }
}

acl_driver = vfile

namespace inbox {
  mailbox Acl-NoDelete {
    acl owner {
      rights = lrwsip
    }
  }
  mailbox Acl-NoExpunge {
    acl owner {
      rights = lrwstip
    }
  }
  mailbox Acl-NoWrite {
    acl owner {
      rights = lrstipe
    }
  }
}
